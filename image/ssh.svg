<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Drop shadow for the terminal window -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Subtle glow for the terminal prompt -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Desktop Background -->
  <rect width="100%" height="100%" fill="#11111b"/>

  <!-- Terminal Window Group -->
  <g filter="url(#shadow)">
    <!-- Terminal Body -->
    <rect x="50" y="50" width="700" height="500" rx="12" fill="#1e1e2e" stroke="#313244" stroke-width="2"/>
    
    <!-- Terminal Header Bar -->
    <path d="M 50 62 Q 50 50 62 50 L 738 50 Q 750 50 750 62 L 750 95 L 50 95 Z" fill="#313244"/>
    
    <!-- Window Controls (Red, Yellow, Green) -->
    <circle cx="85" cy="72.5" r="8" fill="#f38ba8"/>
    <circle cx="115" cy="72.5" r="8" fill="#f9e2af"/>
    <circle cx="145" cy="72.5" r="8" fill="#a6e3a1"/>
  </g>

  <!-- Middle >_ Sign -->
  <!-- Drawn manually using paths and lines to avoid using '>' or '_' as text characters -->
  <g filter="url(#glow)">
    <!-- The '>' chevron -->
    <path d="M 330 230 L 390 290 L 330 350" fill="none" stroke="#a6e3a1" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- The '_' underscore cursor -->
    <line x1="415" y1="350" x2="505" y2="350" stroke="#a6e3a1" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Bottom ssh text -->
  <!-- Using standard text element for 'ssh' as it doesn't violate the specific character constraints -->
  <text x="85" y="505" font-family="'Fira Code', 'Courier New', Courier, monospace" font-size="42" fill="#cdd6f4" font-weight="bold" letter-spacing="3">ssh</text>
  
  <!-- Subtle blinking block cursor after ssh for realism -->
  <rect x="195" y="470" width="22" height="42" fill="#cdd6f4" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1.2s" repeatCount="indefinite"/>
  </rect>

</svg>